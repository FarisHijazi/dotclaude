# See https://pre-commit.com for more information
# Install: uvx pre-commit install
# Run all: uvx pre-commit run --all-files
# Update:  uvx pre-commit autoupdate

exclude: /templates/|node_modules/|\.git/

# The linters/fixers run at commit time only; git-identity-guard opts into pre-push too.
default_stages: [pre-commit]
repos:
  # ── General hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        files: \.(py|sh|js|ts|md|yaml|yml|json)$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── Secrets / credentials ──────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ── Shell ──────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: \.(sh|bash)$
        exclude: shell-snapshots/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-i, '2', -ci]
        files: \.(sh|bash)$
        exclude: shell-snapshots/

  # ── YAML ───────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, '{extends: relaxed, rules: {line-length: {max: 200}}}']

  # ── Markdown ───────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args:
          - --disable
          - MD013  # line length
          - MD033  # inline HTML
          - MD041  # first line heading
          - MD024  # duplicate headings
          - MD036  # emphasis as heading
          - MD060  # table pipe spacing (this repo uses the compact |---| style)
          - --

  # ── Spell checker ──────────────────────────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --skip=*.lock,*.json,plugins/,node_modules/,*.db,bun.lock
          - --ignore-words-list=iam,ser,nd,te

  - repo: local
    hooks:
      # Refuse to commit or push as anyone but the personal identity. Checks the
      # identity git would use (config, includeIf, env) at commit time and every
      # outgoing commit at push time. Script: ~/bin/git-identity-guard (dotfiles).
      - id: no-plugin-state-in-settings
        name: settings.json carries no enabledPlugins
        # Checks the STAGED blob, not the worktree file — the worktree copy is
        # supposed to have the key; only the committed one must not. Catches a
        # clone that never ran scripts/install-git-filters.sh.
        entry: bash -c 'git show :settings.json 2>/dev/null | jq -e "has(\"enabledPlugins\")" >/dev/null && { echo "settings.json still has enabledPlugins - run scripts/install-git-filters.sh"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
        files: '^settings\.json$'
      - id: git-identity-guard
        name: git identity is theefaris@gmail.com
        entry: bash -c 'exec "$HOME/bin/git-identity-guard" "$@"' git-identity-guard
        args: [theefaris@gmail.com]
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: [git-identity-guard]
